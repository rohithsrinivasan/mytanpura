name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Zero dependencies: Node's built-in test runner, no install step.
      - name: Engine tests
        run: node --test web/test/engine.test.mjs

      # tanpura-worklet.js is generated from src/engine.js and committed so that
      # the Vercel deployment needs no build step. If someone edits the engine and
      # forgets to regenerate, the deployed audio silently lags the source.
      - name: Generated worklet is up to date
        run: |
          node web/build-worklet.mjs
          git diff --exit-code -- web/tanpura-worklet.js \
            || (echo "::error::web/tanpura-worklet.js is stale. Run: node web/build-worklet.mjs" && exit 1)

  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Needed by the tag-triggered release step at the end of this job.
    permissions:
      contents: write

    # Secrets cannot be read from a step-level `if`, so the presence check is
    # hoisted into a job-level env var.
    env:
      HAS_KEYSTORE: ${{ secrets.TANPURA_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Git on Windows does not preserve the executable bit, so the committed
      # wrapper may arrive without it.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Kotlin compiler errors are re-emitted as ::error:: annotations and copied
      # into the job summary. Without this the only machine-readable signal is
      # "exit code 1", and reading the raw log needs an authenticated token.
      - name: Unit tests (audio engine and music model)
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### Gradle output (tail)'
              echo '```'
              tail -250 /tmp/gradle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^e: |^w: .*error|error:' /tmp/gradle.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$code"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # A Play-uploadable build needs the four TANPURA_* secrets. Without them the
      # release build still succeeds, signed with the debug key, which installs
      # fine on your own phone but cannot be uploaded to Play.
      - name: Decode release keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TANPURA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK and Play bundle
        env:
          TANPURA_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          TANPURA_KEYSTORE_PASSWORD: ${{ secrets.TANPURA_KEYSTORE_PASSWORD }}
          TANPURA_KEY_ALIAS: ${{ secrets.TANPURA_KEY_ALIAS }}
          TANPURA_KEY_PASSWORD: ${{ secrets.TANPURA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Report how the release was signed
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Release signed with the upload keystore from secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TANPURA_KEYSTORE_BASE64 secret set: the release APK is debug-signed." >> "$GITHUB_STEP_SUMMARY"
            echo "It installs on your phone but cannot be uploaded to Google Play." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tanpura-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: tanpura-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Pushing a version tag publishes a GitHub Release with the APK attached.
      # Release assets are downloadable without a GitHub account, unlike the
      # workflow artifacts above - so this is how you share a build.
      #
      #   git tag v1.0.0 && git push origin v1.0.0
      - name: Publish a release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
